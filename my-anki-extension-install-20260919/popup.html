<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Kindle Sync</title>
    <style>
      :root {
        --background: #09090b; --foreground: #fafafa; --card: #101012;
        --muted: #27272a; --muted-foreground: #a1a1aa; --border: #27272a;
        --primary: #fafafa; --primary-foreground: #18181b; --ring: #52525b;
        --good: #4ade80; --hard: #fbbf24; --again: #f87171;
        --radius: .75rem;
        --sans: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { width: 330px; min-height: 332px; margin: 0; padding: 16px; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--sans); }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
      .sync-status { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-foreground); font-size: 12px; padding: 3px 9px; white-space: nowrap; }
      .sync-status::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--muted-foreground); }
      .sync-status[data-state="ready"]::before { background: var(--good); }
      .sync-status[data-state="working"]::before { background: var(--hard); }
      .sync-status[data-state="issue"]::before { background: var(--again); }
      .progress { height: 4px; margin: 14px 0 18px; overflow: hidden; border-radius: 999px; background: var(--muted); }
      .progress > span { display: block; width: 34%; height: 100%; border-radius: inherit; background: var(--foreground); }
      .stage { min-height: 210px; padding: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: 0 20px 40px -24px rgba(0, 0, 0, .65); }
      .label { margin: 0 0 10px; color: var(--muted-foreground); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
      h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; line-height: 1.25; }
      .copy { margin: 12px 0 0; color: var(--muted-foreground); font-size: 13px; }
      #status { min-height: 40px; margin: 18px 0 0; color: var(--muted-foreground); font-size: 12px; }
      .btn { width: 100%; height: 48px; border: 0; border-radius: calc(var(--radius) - 2px); background: var(--primary); color: var(--primary-foreground); cursor: pointer; font: 600 14px var(--sans); }
      .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      .btn:disabled { cursor: wait; opacity: .55; }
      .footnote { margin: 16px 0 0; color: var(--muted-foreground); font-size: 11px; text-align: center; }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>My Anki</h1>
      <span class="sync-status" id="pill" data-state="ready">Kindle sync</span>
    </header>
    <div class="progress"><span></span></div>
    <main class="stage">
      <p class="label">Kindle · My Anki</p>
      <h2>Sync one book</h2>
      <p class="copy">Collect highlights from the Kindle notebook open in this Chrome window.</p>
      <p id="status" role="status"></p>
      <button class="btn" id="sync">Sync one book</button>
    </main>
    <p class="footnote">Amazon credentials always stay inside Amazon.</p>
    <script src="popup.js"></script>
  </body>
</html>
