<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Anki</title>
  <meta name="description" content="Spaced repetition over my Kindle highlights.">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Anki">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <style>
    /* Geist, self-hosted so the app works offline and pulls from no third party. */
    @font-face {
      font-family: Geist; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(./geist-latin-ext.woff2) format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: Geist; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(./geist-latin.woff2) format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
  <style>
    /* shadcn/ui zinc, dark. This app is dark-only by choice, so the palette is
       defined once on :root with no prefers-color-scheme branch — every colour
       below is painted explicitly rather than inherited from the viewer. */
    :root {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #101012;
      --muted: #27272a;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --input: #27272a;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --secondary: #27272a;
      --secondary-foreground: #fafafa;
      --ring: #52525b;
      --again: #f87171;
      --hard: #fbbf24;
      --good: #4ade80;
      --easy: #60a5fa;
      --note: #fde68a;
      --note-bg: #26200b;
      --radius: 0.75rem;
      --sans: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    #app {
      display: flex; flex-direction: column;
      min-height: 100dvh;
      width: min(27rem, 100%);
      margin: 0 auto;
      padding: calc(0.9rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));
    }

    /* ---- Header ---- */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .bar h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    .bar .pos { color: var(--muted-foreground); font-size: 0.8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar h1 { white-space: nowrap; }

    /* A segmented control rather than a scrolling row of pills: the decks are
       laid into equal columns sized to the screen, so nothing overflows and
       nothing needs a fade to hint at what is hidden. --n is the segment count,
       set from the deck, so a deck with fewer themes gets wider segments. */
    .pills {
      display: grid;
      /* min-content keeps a long theme name whole — equal columns would clip
         "Mindfulness" — while 1fr shares the leftover space with the rest. */
      grid-template-columns: repeat(var(--n, 5), minmax(min-content, 1fr));
      gap: 2px;
      margin: 0.8rem 0 0.9rem;
      padding: 3px;
      background: var(--muted);
      border-radius: calc(var(--radius) - 2px);
      /* Backstop only. Five segments fit every phone; a six-segment deck of
         long names on a 320px screen would not, and the control scrolling is
         far better than the whole page scrolling sideways. */
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }
    /* Small phones get slightly smaller type so the backstop stays unused. */
    @media (max-width: 360px) {
      .pill { font-size: 0.66rem; padding: 0 0.1rem; }
      .pill .n { font-size: 0.58rem; }
    }
    .pill {
      min-height: 2.4rem;
      padding: 0 0.2rem;
      border: 0;
      border-radius: calc(var(--radius) - 5px);
      background: transparent;
      color: var(--muted-foreground);
      font-size: 0.72rem; font-weight: 600; line-height: 1.15;
      display: grid; place-items: center; gap: 1px;
    }
    /* No ellipsis here on purpose: `overflow: hidden` reports a min-content
       width of zero, which collapses the min-content track above and clips the
       longest theme name. Labels come from a fixed list in build_deck.py and
       are short enough to set whole. */
    .pill .t { white-space: nowrap; }
    .pill .n {
      font-size: 0.62rem; font-weight: 500;
      opacity: 0.8; font-variant-numeric: tabular-nums;
    }
    .pill[aria-pressed="true"] {
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .progress { height: 4px; border-radius: 999px; background: var(--muted); overflow: hidden; }
    .progress > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.2s ease; }
    @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }

    /* ---- Card stage ----
       Anchored near the top with its own card boundary rather than dead-
       centered in the full remaining height — a short question used to leave
       equal, unexplained gaps above and below it. */
    .stage {
      margin-top: 1.75rem;
      max-height: 60dvh; min-height: 0;
      display: flex; flex-direction: column; justify-content: flex-start;
      gap: 1rem; overflow-y: auto; padding: 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 20px 40px -24px rgba(0, 0, 0, 0.65);
    }
    .prompt-label { color: var(--muted-foreground); font-size: 0.72rem; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; }
    .stage .quote { margin: 0; font-size: 1.2rem; font-weight: 450; line-height: 1.5; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .stage .question { margin: 0; font-size: 1.15rem; font-weight: 650; line-height: 1.45; letter-spacing: -0.01em; }
    .answer { border-top: 1px solid var(--border); padding-top: 1rem; display: grid; gap: 0.7rem; }
    .answer .quote { font-size: 1.05rem; }
    .answer .src-line { font-size: 0.85rem; color: var(--muted-foreground); }
    .answer .src-line .bt { color: var(--foreground); font-weight: 650; }
    .badge {
      display: inline-flex; align-items: center;
      border-radius: 999px;
      background: var(--secondary); color: var(--secondary-foreground);
      padding: 0.1rem 0.6rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.01em;
      vertical-align: middle;
    }
    .note-box { background: var(--note-bg); color: var(--note); border-radius: calc(var(--radius) - 2px); padding: 0.6rem 0.75rem; font-size: 0.8rem; margin: 0; }
    .note-box::before { content: "your note — "; font-weight: 700; }

    /* ---- Controls ---- */
    .controls { display: grid; gap: 0.5rem; margin-top: auto; padding-top: 1.25rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      padding: 0 0.9rem; height: 3rem;
      font-size: 0.95rem; font-weight: 600;
      background: var(--primary); color: var(--primary-foreground);
      white-space: nowrap;
    }
    .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .grade {
      display: grid; gap: 0.1rem; justify-items: center;
      background: var(--background); border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      padding: 0.55rem 0.25rem;
    }
    .grade b { font-size: 0.85rem; font-weight: 650; }
    .grade span { font-size: 0.68rem; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .grade.g0 b { color: var(--again); } .grade.g1 b { color: var(--hard); }
    .grade.g2 b { color: var(--good); } .grade.g3 b { color: var(--easy); }

    /* ---- Shared account + sync controls (identical across Pomodoro,
       Reading List and My Anki; literal hex so it doesn't depend on each
       app's own token names). Identity and sync health are deliberately two
       separate controls: one answers "who am I", the other "are my data
       safe". ---- */
    .account-bar { display: inline-flex; align-items: center; gap: 0.35rem; }
    .account {
      display: inline-flex; align-items: center; gap: 7px;
      min-height: 0; padding: 3px 10px 3px 4px;
      border: 1px solid #27272a; border-radius: 999px;
      background: transparent; color: #fafafa;
      font: inherit; font-size: 12px; font-weight: 500; line-height: 1.3;
      cursor: pointer;
    }
    .account .av {
      width: 20px; height: 20px; border-radius: 999px;
      background: #27272a; color: #fafafa;
      font-size: 11px; font-weight: 600;
      display: grid; place-items: center;
    }
    .account.out {
      padding: 3px 11px; border-color: transparent;
      background: #fafafa; color: #18181b; font-weight: 600;
    }
    .account.off { cursor: default; opacity: 0.6; color: #a1a1aa; }
    .account:focus-visible, .sync-status:focus-visible { outline: 2px solid #52525b; outline-offset: 2px; }

    .sync-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px;
      border: 1px solid #27272a; border-radius: 999px;
      color: #a1a1aa;
      font: inherit; font-size: 12px; font-weight: 500; line-height: 1.3;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .sync-status::before {
      content: ""; width: 6px; height: 6px; border-radius: 999px;
      background: #52525b; flex: 0 0 auto;
    }
    .sync-status[data-status="synced"]::before { background: #4ade80; }
    .sync-status[data-status="syncing"]::before { background: #4ade80; animation: sync-pulse 1.1s ease-in-out infinite; }
    .sync-status[data-status="pending"] { color: #fbbf24; }
    .sync-status[data-status="pending"]::before { background: #fbbf24; }
    .sync-status[data-status="issue"] { color: #f87171; }
    .sync-status[data-status="issue"]::before { background: #f87171; }
    @keyframes sync-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.82); }
      50%      { opacity: 1;    transform: scale(1.16); }
    }
    @media (prefers-reduced-motion: reduce) { .sync-status::before { animation: none !important; } }
    /* My Anki's column is a fixed 27rem and the bar already carries a deck
       counter, so the account here is avatar-only at every width — the email
       lives in its tooltip and in the sign-out confirm. The sibling apps have
       wider headers and show the name. */
    .account .nm { display: none; }
    .account { padding: 3px 4px; }

    /* ---- Deck-clear state ---- */
    .done {
      flex: 1;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 0.6rem; text-align: center;
    }
    .done .big { font-size: 2.4rem; }
    .done h2 { margin: 0; font-size: 1.2rem; letter-spacing: -0.02em; }
    .done p { margin: 0; color: var(--muted-foreground); font-size: 0.85rem; }
    .done .wait-time { font-size: 1.6rem; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--foreground); }
    .foot-note { margin: 0; padding-top: 0.9rem; color: var(--muted-foreground); font-size: 0.7rem; text-align: center; line-height: 1.6; }

    /* ---- Desktop ----
       Below this width #app is just its natural mobile column, centered by
       margin auto. Above it, give the column an actual panel — ambient glow
       + a faint dot grid behind it, a border and shadow around it — so a
       wide screen reads as a designed desktop layout, not a phone page
       stretched into a black void. */
    @media (min-width: 640px) {
      body {
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
      }
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none;
        background:
          radial-gradient(circle at 50% 34%, rgba(250, 250, 250, 0.05) 0%, rgba(250, 250, 250, 0.02) 32%, rgba(9, 9, 11, 0) 62%),
          radial-gradient(rgba(161, 161, 170, 0.14) 1px, transparent 1px) 0 0 / 28px 28px;
        -webkit-mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 68%);
        mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 68%);
      }
      #app {
        position: relative;
        min-height: auto;
        max-height: min(44rem, 92dvh);
        padding: 1.5rem 1.5rem 1.75rem;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 8px);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 48px 96px -32px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(250, 250, 250, 0.02);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- Outside #app on purpose: render() replaces #app's innerHTML wholesale on
       every screen, including mid-card, so a watermark placed inside it would
       either vanish on some screens or need re-injecting on every render.
       This exists purely so one screenshot from any device is enough to tell
       whether two devices are actually running the same deck and the same
       app build — the exact question that used to take a back-and-forth to
       answer. -->
  <div id="verhint" aria-hidden="true" style="position:fixed;left:6px;bottom:4px;font-size:0.55rem;line-height:1;color:#52525b;opacity:0.55;font-variant-numeric:tabular-nums;pointer-events:none;z-index:9999;"></div>
  <script src="./data.js"></script>
  <script>
    // ---- One-time key rename: brain-gym.* -> my-anki.* ----
    // This app was called Brain Gym until 2026-08 and kept everything —
    // scheduling state, sync cursor, client id, outbox — under a "brain-gym."
    // prefix. It moved to a new path on the SAME origin, so those keys are
    // still readable from here. Copy them once, before any code below reads a
    // key, and leave the originals in place: they cost nothing, they are the
    // rollback if this build has to be reverted, and the old app (still
    // installed as a home-screen PWA until its forwarder is picked up) keeps
    // working from them.
    //
    // `client.v1` in particular MUST come across. Review rows copied into the
    // new Firestore collection keep their original clientId, and the pull path
    // recognises a row as "already applied locally" only by matching it — a
    // fresh id here would make this device's own history look foreign and
    // re-fold on top of itself.
    const KEYS_MIGRATED_KEY = "my-anki.keys-migrated.v1";
    const RENAMED_KEY_SUFFIXES = [
      "srs.v2", "sync.v1", "auth-migrated.v1", "outbox.v1", "cursor.v1",
      "client.v1", "migrated.v1", "reconcile.v1", "lastsync.v1",
    ];
    // `newcount.v1` is deliberately absent: it is dead legacy state that the
    // code below already deletes under its old name.
    (function copyRenamedKeys() {
      if (localStorage.getItem(KEYS_MIGRATED_KEY)) return;
      for (const suffix of RENAMED_KEY_SUFFIXES) {
        const prior = localStorage.getItem("brain-gym." + suffix);
        if (prior !== null && localStorage.getItem("my-anki." + suffix) === null) {
          localStorage.setItem("my-anki." + suffix, prior);
        }
      }
      localStorage.setItem(KEYS_MIGRATED_KEY, "1");
    })();

    const app = document.getElementById("app");
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // Kindle titles carry the whole cover: "Expectations Investing: Reading
    // Stock Prices for Better Returns, Revised and Updated (Heilbrunn Center
    // for Graham & Dodd Investing Series)". Set whole, that runs to four lines
    // above the question and buries it. Everything up to the subtitle is what
    // anyone actually calls the book.
    const shortTitle = (t) => (String(t).split(/[:(]/)[0].trim() || String(t));

    const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };

    // Bumped by hand alongside sw.js's CACHE constant on every deploy — see
    // updateVerhint() below for why this exists.
    const APP_BUILD = "202608281800";

    // ---- The deck itself: not a load-time constant ----
    // A single-file, one-fetch app used to be a safe assumption: one device,
    // one open tab. It stopped being safe the day sync shipped — the deck now
    // gets rebuilt by a nightly job while the app might be open on two
    // devices at once, and a device that loaded before a rebuild would
    // otherwise show a stale catalog (different book count, different pill
    // totals) forever, until someone thinks to force-quit and reopen it. So
    // `themes`/`books`/`THEME`/`cards` are `let`s, rebuilt by applyDeck() —
    // at load, and again whenever checkDeck() (below) finds the published
    // data.js has changed. `deckSnapshot` is a canonicalized JSON string of
    // the currently-applied deck, compared structurally rather than by raw
    // bytes so re-fetching the same content never false-positives.
    let themes, books, THEME, cards, deckSnapshot;

    // Only highlights aligned with their book's core subject are reviewable.
    // build_deck.py already drops the rest, so a generated deck carries no
    // `aligned` field at all; absent therefore has to mean included, or a real
    // deck filters itself down to nothing. Deterministic shuffle (hash of id)
    // so new cards mix books but stay stable between visits.
    function applyDeck(data) {
      themes = data.themes;
      books = data.books;
      THEME = Object.fromEntries(themes.map(t => [t.id, t.label]));
      cards = books.flatMap(b => b.highlights.map(h => ({ ...h, book: b })))
        .filter(c => c.aligned !== false)
        .sort((a, b) => hash(a.id) - hash(b.id));
      deckSnapshot = JSON.stringify(data);
      updateVerhint();
    }

    // A silent watermark, not UI: the whole reason two devices used to take a
    // multi-message diagnosis to compare is that nothing on screen said which
    // deck or which app code was actually running. This makes that a single
    // screenshot — deck book count + a short hash of its content, plus the
    // app build stamp — so "are these two devices actually in sync" stops
    // being a question that needs me to answer it.
    function updateVerhint() {
      const el = document.getElementById("verhint");
      if (!el) return;
      const h = (hash(deckSnapshot) >>> 0).toString(16).padStart(8, "0").slice(0, 6);
      el.textContent = `deck ${books.length}·${h} · app ${APP_BUILD}`;
    }
    applyDeck(window.ANKI);

    // ---- Spaced repetition: SM-2 with Anki's learning steps ----
    //
    // Day-granularity alone collapses Hard and Good into the same "1d" on a
    // brand-new card, which makes the two buttons indistinguishable exactly
    // when you use them most. Real Anki avoids that by walking new cards
    // through sub-day learning steps first, so every grade lands somewhere
    // different. Due times are therefore timestamps, not day numbers.
    //
    // Card states: lrn (learning), rev (review), rel (relearning after a lapse).
    const SRS_KEY = "my-anki.srs.v2";
    const MIN = 60e3, DAY = 864e5;
    const LEARN_STEPS = [1 * MIN, 10 * MIN];   // new card path
    const RELEARN_STEPS = [10 * MIN];          // after a lapse
    const GRAD_IVL = 1;      // days, graduating with Good
    const EASY_IVL = 4;      // days, graduating straight out with Easy
    const LAPSE_IVL = 1;     // days, where a lapsed card restarts
    const HARD_FACTOR = 1.2, EASY_BONUS = 1.3, MIN_EF = 1.3, START_EF = 2.5;
    const LEECH_LAPSES = 8;  // Anki's default: 8 lapses tags + suspends

    const loadSrs = () => { try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; } catch { return {}; } };
    const saveSrs = s => localStorage.setItem(SRS_KEY, JSON.stringify(s));
    let srs = loadSrs();

    const freshState = () => ({ st: "lrn", step: 0, ef: START_EF, ivl: 0, due: 0, reps: 0, lapses: 0 });

    // Interval fuzz, the way Anki applies it: day-granularity intervals get a
    // small random spread so cards introduced together don't all come due on
    // the same future day forever. Never applied to sub-day learning steps,
    // and never to 1-day intervals. Deterministic on purpose: the seed is the
    // card's identity + rep count, so delayLabel (which re-runs schedule() to
    // paint the buttons) and the actual grade land on the exact same day — a
    // Math.random() here would let a button promise 12d and deliver 14d.
    function fuzzIvl(n, seed) {
      if (n < 2) return n;
      // mulberry32: one deterministic uniform draw in [0, 1) from the seed.
      let t = (seed + 0x6D2B79F5) >>> 0;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      if (n === 2) return 2 + Math.round(r);          // Anki's special case: 2–3
      const pct = n < 7 ? 0.25 : n < 30 ? 0.15 : 0.05;
      const span = Math.max(1, Math.round(n * pct));
      return Math.max(1, n - span + Math.round(r * 2 * span));
    }

    // Pure: given a state and a grade, return the state that would follow.
    // Both the grade buttons (for their labels) and applyGrade use this, so a
    // button can never promise an interval the scheduler won't deliver.
    // `seed` feeds fuzzIvl; callers pass hash(card.id) so the fuzz is stable
    // per card per rep.
    function schedule(prev, g, now, seed = 0) {
      // `intro` is the moment a card was first graded. It lives in the card
      // state so it rides the sync log like everything else — that's what
      // lets the daily new-card budget be shared across devices instead of
      // each one quietly opening its own 20.
      const s = prev ? { ...prev } : { ...freshState(), intro: now };
      const fz = (n) => fuzzIvl(n, seed + s.reps);
      const days = (n) => { s.due = now + n * DAY; s.ivl = n; };
      const mins = (ms) => { s.due = now + ms; };

      if (s.st === "lrn") {
        if (g === 0) { s.step = 0; mins(LEARN_STEPS[0]); }
        else if (g === 1) {
          // Hard repeats the current step; on the first step Anki uses the
          // average of step one and two, which is what makes it ~6m not 1m.
          mins(s.step === 0 ? (LEARN_STEPS[0] + LEARN_STEPS[1]) / 2 : LEARN_STEPS[s.step]);
        } else if (g === 2) {
          if (s.step + 1 >= LEARN_STEPS.length) { s.st = "rev"; s.reps += 1; days(fz(GRAD_IVL)); }
          else { s.step += 1; mins(LEARN_STEPS[s.step]); }
        } else { s.st = "rev"; s.reps += 1; days(fz(EASY_IVL)); }
        return s;
      }

      if (s.st === "rel") {
        if (g <= 1) mins(RELEARN_STEPS[0]);
        else if (g === 2) { s.st = "rev"; s.reps += 1; days(fz(Math.max(1, s.ivl || LAPSE_IVL))); }
        else { s.st = "rev"; s.reps += 1; days(fz(Math.max(1, s.ivl || LAPSE_IVL) + 1)); }
        return s;
      }

      // Review card.
      const ivl = s.ivl || GRAD_IVL;
      if (g === 0) {
        s.st = "rel"; s.step = 0; s.lapses += 1;
        if (s.lapses >= LEECH_LAPSES) s.leech = true;   // suspended, Anki-style
        s.ef = Math.max(MIN_EF, s.ef - 0.2);
        s.ivl = LAPSE_IVL;                       // where it lands once relearned
        s.due = now + RELEARN_STEPS[0];
        return s;
      }
      // Compute all three from the pre-grade ease, then force them strictly
      // apart. Rounding alone lets Good and Easy collide on short intervals
      // (at ivl 1 both round to 3d), which hides the difference between the
      // buttons on exactly the young cards where it matters most. Fuzz runs
      // inside the chain so it can never re-order the three.
      s.reps += 1;
      const hardI = fz(Math.max(ivl + 1, Math.round(ivl * HARD_FACTOR)));
      const goodI = Math.max(hardI + 1, fz(Math.round(ivl * s.ef)));
      const easyI = Math.max(goodI + 1, fz(Math.round(ivl * s.ef * EASY_BONUS)));
      if (g === 1) { s.ef = Math.max(MIN_EF, s.ef - 0.15); days(hardI); }
      else if (g === 2) { days(goodI); }
      else { s.ef += 0.15; days(easyI); }
      return s;
    }

    function applyGrade(id, g) {
      const now = Date.now();
      srs[id] = schedule(srs[id], g, now, hash(id));
      // Sync-only bookkeeping, not part of the scheduling model: the latest
      // reviewedAt this device has folded into this card, own or foreign. See
      // pullReviews() for why it matters — schedule() itself never reads it,
      // and just carries it through unchanged on every future call.
      srs[id].__lastReviewAt = Math.max(srs[id].__lastReviewAt ?? -Infinity, now);
      saveSrs(srs);
      enqueueReview(id, g, now);   // no-op until sync is enabled; never awaited here
      return srs[id];
    }

    // Label for a grade button: how far away that choice puts the card.
    // Same seed as applyGrade, so the label and the grade share the fuzz.
    function delayLabel(prev, g, id) {
      const now = Date.now();
      return fmtDelay(schedule(prev, g, now, hash(id)).due - now);
    }
    // Ported from Anki's timespan.rs: seconds, minutes and days round to whole
    // numbers while hours, months and years carry one decimal. The decimal is
    // load-bearing — without it 33d and 42d would both read "1mo" and two
    // genuinely different intervals would look identical on the buttons.
    const YEAR_D = 365, MONTH_D = 365 / 12;
    const dec = (n) => (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
    function fmtDelay(ms) {
      const s = ms / 1000;
      if (s < 60) return Math.round(s) + "s";
      const m = s / 60;
      if (m < 60) return Math.round(m) + "m";
      const h = m / 60;
      if (h < 24) return dec(h) + "h";
      const d = h / 24;
      if (d < MONTH_D) return Math.round(d) + "d";
      if (d < YEAR_D) return dec(d / MONTH_D) + "mo";
      return dec(d / YEAR_D) + "y";
    }

    // Anki's default: 20 new cards per calendar day, TOTAL — not per deck,
    // not per session, and not per device. The count is derived from the
    // card states themselves (every card carries the `intro` timestamp of
    // its first grade), so it's the same number on every device once the
    // sync log has folded in: 20 today means 20 across phone and laptop
    // together, not 20 each. Nothing is stored separately for it, so
    // reopening the app can't refill the budget either.
    const NEW_PER_DAY = 20;
    const dateStr = (ms) => {
      const d = new Date(ms);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    };
    function newIntroducedToday() {
      const today = dateStr(Date.now());
      let n = 0;
      for (const c of cards) {
        const st = srs[c.id];
        if (st && st.intro && dateStr(st.intro) === today) n += 1;
      }
      return n;
    }
    // One-time backfill for states written before `intro` existed: the best
    // available guess is the card's last review. Only wrong for an old card
    // that also happened to be reviewed today, and only for today.
    for (const id of Object.keys(srs)) {
      const st = srs[id];
      if (st && st.intro == null && st.__lastReviewAt) st.intro = st.__lastReviewAt;
    }
    localStorage.removeItem("brain-gym.newcount.v1");   // the per-device counter this replaces

    // The header progress count, same idea as newIntroducedToday(): derived
    // from __lastReviewAt (set on every grade, local AND folded in from
    // another device — see applyGrade and pullReviewsInner) rather than kept
    // as in-memory session state. A count that lives only in `session` gets
    // silently zeroed the moment a sync pull rebuilds the session, which is
    // exactly what happens every time the OTHER device's grades arrive. This
    // way "12 / 24" means 12 cards touched today across every device, and it
    // survives a session rebuild because it isn't stored in the session.
    function reviewedTodayCard(c) {
      const st = srs[c.id];
      return !!(st && st.__lastReviewAt && dateStr(st.__lastReviewAt) === dateStr(Date.now()));
    }
    function reviewedToday(theme) {
      const pool = theme === "all" ? cards : cards.filter(c => c.theme === theme);
      let n = 0;
      for (const c of pool) if (reviewedTodayCard(c)) n += 1;
      return n;
    }
    // { done, total } for the header/progress bar. `done` is today's real,
    // cross-device count; `total` adds whatever's still queued that hasn't
    // been touched today yet, so it grows/shrinks with the actual queue
    // instead of being a frozen snapshot from session start.
    function progress(s) {
      const done = reviewedToday(activeTheme);
      const remaining = s.queue.filter(c => !reviewedTodayCard(c)).length;
      return { done, total: done + remaining };
    }

    // New cards are drawn in a different order every session. With a fixed
    // order, opening the app without grading anything always lands on the
    // same card, which makes a deck of a hundred feel like a deck of one.
    // Reviews stay strictly oldest-due-first, the way Anki orders them.
    const shuffle = (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };
    let newOrder = {};                       // theme -> shuffled ids, per session
    function dueCards(theme) {
      const now = Date.now();
      const pool = cards.filter(c => theme === "all" || c.theme === theme);
      // Leeches (8+ lapses) are suspended: they never enter the queue again.
      const due = pool.filter(c => srs[c.id] && !srs[c.id].leech && srs[c.id].due <= now)
        .sort((a, b) => srs[a.id].due - srs[b.id].due);
      const unseen = pool.filter(c => !srs[c.id]);
      if (!newOrder[theme]) newOrder[theme] = shuffle(unseen.map(c => c.id));
      const rank = new Map(newOrder[theme].map((id, i) => [id, i]));
      const fresh = unseen
        .sort((a, b) => (rank.get(a.id) ?? 0) - (rank.get(b.id) ?? 0))
        .slice(0, Math.max(0, NEW_PER_DAY - newIntroducedToday()));
      return [...due, ...fresh];
    }

    // ---- Optional multi-device sync (Firestore) ----
    //
    // Off by default: `srs` stays exactly what it always was, one localStorage
    // blob, and the app is fully usable with zero network calls. Turning sync
    // on (opening the app once with a #fb_api_key=...&fb_project_id=...&sync_key=...
    // fragment — see README) adds an append-only log of every grade, synced
    // across devices, so the schedule shown on your phone and your laptop is
    // the same schedule rather than two that quietly drift apart.
    //
    // Design: the log, not `srs` itself, is the thing that syncs. A grade is a
    // fact ("Good on card X at 9:14pm") that gets appended once and never
    // edited; `srs` is just the fold of every fact through the pure
    // schedule() above, cached locally for instant reads. This is the same
    // shape Anki's own revlog uses, and it's what makes three things work for
    // free: two devices grading the same card in the same window both count
    // (a "last write wins" table would silently drop one); a wiped phone
    // recovers completely by replaying the log; and a future scheduler change
    // (different constants, FSRS, whatever) can replay history under the new
    // rules instead of starting blind.
    //
    // Tenancy is the signed-in Google account's uid — sign in once per
    // device and the review log follows the account. Firestore is still
    // spoken to over its plain REST API via fetch() (this app self-hosts its
    // font and keeps CDN reach minimal); only Firebase Auth comes from the
    // gstatic SDK, loaded by the module script at the bottom, because a
    // hand-rolled OAuth flow is the one thing not worth owning. The web
    // config below is public by design — access control lives in Firestore
    // rules keyed to request.auth.uid, not in these values.
    const FIREBASE = {
      apiKey: "AIzaSyA5_DhdTdqjCVDeOgklUFcnJ1lwfESiP8Y",
      authDomain: "my-reading-list-3fa75.firebaseapp.com",
      projectId: "my-reading-list-3fa75",
      appId: "1:101190488885:web:f0401ddd67b862f163b27c",
    };
    const LEGACY_CONFIG_KEY = "my-anki.sync.v1";
    const AUTH_MIGRATED_KEY = "my-anki.auth-migrated.v1";
    const OUTBOX_KEY = "my-anki.outbox.v1";
    const CURSOR_KEY = "my-anki.cursor.v1";
    const CLIENT_ID_KEY = "my-anki.client.v1";
    const MIGRATED_KEY = "my-anki.migrated.v1";
    const RECONCILE_KEY = "my-anki.reconcile.v1";
    // Set once the Brain Gym collection has been copied across. Holds that
    // collection's tip at the moment of the copy, not a bare "1", so the
    // stray probe below knows where to start looking for anything the old app
    // wrote afterwards.
    const FS_IMPORT_KEY = "my-anki.fs-import.v1";
    // The old app's queue of grades that never reached the server. Read (and
    // emptied) by the scavenger below; the one old key this build writes to.
    const LEGACY_OUTBOX_KEY = "brain-gym.outbox.v1";
    // Set when a fold had to be skipped because a row arrived out of order;
    // cleared by the full replay that resolves it.
    const PENDING_REBUILD_KEY = "my-anki.pending-rebuild.v1";
    const REVIEW_PAGE_SIZE = 300;

    // Every Firestore path this app touches hangs off one of these two roots.
    // The app was called Brain Gym until 2026-08 and wrote everything under
    // `brain_gym/{uid}`; it now writes under `my_anki/{uid}`. The old root is
    // still read — by the one-time import below, and by the stray probe that
    // covers a device still running the old build — so it stays named here
    // rather than being spelled out at each call site.
    const COLLECTION = "my_anki";
    const LEGACY_COLLECTION = "brain_gym";
    // A cfg may carry an explicit `root` to read from somewhere other than
    // this app's current collection (the Brain Gym import, the stray probe);
    // everything else lands in COLLECTION.
    function rootOf(cfg) { return cfg.root ?? COLLECTION; }

    function getClientId() {
      let id = localStorage.getItem(CLIENT_ID_KEY);
      if (!id) { id = crypto.randomUUID(); localStorage.setItem(CLIENT_ID_KEY, id); }
      return id;
    }

    async function sha256Hex(text) {
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function loadLegacyConfig() {
      try { return JSON.parse(localStorage.getItem(LEGACY_CONFIG_KEY)) || null; } catch { return null; }
    }
    function isSyncEnabled() { return Boolean(authUser); }
    function liveCfg() { return { projectId: FIREBASE.projectId, apiKey: FIREBASE.apiKey, tenant: authUser.uid, auth: true }; }
    // The bookmark-era tenant predates both the account migration and the
    // rename, so it is read from the old collection explicitly.
    function legacyCfg(old) { return { projectId: old.projectId, apiKey: old.apiKey, tenant: old.syncKeyHash, auth: false, root: LEGACY_COLLECTION }; }
    // The same account's data as it stood under the old name — the source of
    // the one-time import and of the stray probe that follows it.
    function brainGymCfg() { return { ...liveCfg(), root: LEGACY_COLLECTION }; }
    async function cfgHeaders(cfg) {
      return cfg.auth && authUser ? { Authorization: "Bearer " + await authUser.getToken() } : {};
    }

    // ---- Firestore REST: minimal typed-value encode/decode ----
    // Firestore's REST API wants every value wrapped as e.g. {stringValue:…}
    // or {integerValue:"5"} (integers are strings on the wire), not plain
    // JSON. This is the whole of what's needed for the two document shapes
    // this app writes and reads — no SDK required for that.
    function fsValue(v) {
      if (v === null || v === undefined) return { nullValue: null };
      if (typeof v === "string") return { stringValue: v };
      if (typeof v === "boolean") return { booleanValue: v };
      if (v instanceof Date) return { timestampValue: v.toISOString() };
      if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
      if (Array.isArray(v)) return { arrayValue: { values: v.map(fsValue) } };
      if (typeof v === "object") return { mapValue: { fields: fsFields(v) } };
      throw new Error("fsValue: unsupported type " + typeof v);
    }
    function fsFields(obj) {
      const out = {};
      for (const k of Object.keys(obj)) out[k] = fsValue(obj[k]);
      return out;
    }
    function fsDecode(v) {
      if (!v) return null;
      if ("stringValue" in v) return v.stringValue;
      if ("integerValue" in v) return parseInt(v.integerValue, 10);
      if ("doubleValue" in v) return v.doubleValue;
      if ("booleanValue" in v) return v.booleanValue;
      if ("timestampValue" in v) return v.timestampValue;   // kept as an ISO string
      if ("mapValue" in v) return fsDecodeFields(v.mapValue.fields || {});
      if ("arrayValue" in v) return (v.arrayValue.values || []).map(fsDecode);
      return null;
    }
    function fsDecodeFields(fields) {
      const out = {};
      for (const k of Object.keys(fields)) out[k] = fsDecode(fields[k]);
      return out;
    }
    function fsBase(cfg) {
      return `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents`;
    }

    // Creates a document that must not already exist, with `createdAt` set to
    // the server's write time rather than anything the client claims. Both
    // properties come from the same feature — Firestore's `:commit` endpoint,
    // via `currentDocument.exists: false` (create-only: a retried flush of the
    // same id gets a clean "already exists" rather than silently overwriting)
    // and `updateTransforms` with `setToServerValue: "REQUEST_TIME"` (a value
    // the client cannot forge, which is what makes it trustworthy as a sync
    // cursor). The simpler createDocument REST method doesn't support that
    // transform, which is the whole reason this uses :commit instead.
    async function fsCreateDoc(cfg, relPath, fields) {
      const name = `projects/${cfg.projectId}/databases/(default)/documents/${relPath}`;
      const res = await fetch(`${fsBase(cfg)}:commit?key=${encodeURIComponent(cfg.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await cfgHeaders(cfg)) },
        body: JSON.stringify({
          writes: [{
            update: { name, fields: fsFields(fields) },
            updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }],
            currentDocument: { exists: false },
          }],
        }),
      });
      if (res.status === 409) return { created: false };   // already there: idempotent no-op
      if (!res.ok) throw new Error(`fsCreateDoc ${relPath}: HTTP ${res.status}`);
      return { created: true };
    }

    async function fsGetDoc(cfg, relPath) {
      const res = await fetch(`${fsBase(cfg)}/${relPath}?key=${encodeURIComponent(cfg.apiKey)}`, { headers: await cfgHeaders(cfg) });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`fsGetDoc ${relPath}: HTTP ${res.status}`);
      const doc = await res.json();
      return fsDecodeFields(doc.fields || {});
    }

    // One page of the review log after `afterIso` (exclusive), oldest first.
    // Ordering by (createdAt, __name__) rather than createdAt alone is the
    // standard Firestore pattern for a stable pagination cursor when a field
    // isn't guaranteed unique — kept here for that reason even though, for one
    // person's review log, two documents sharing the same microsecond is
    // vanishingly unlikely to matter in practice.
    async function fsQueryReviews(cfg, afterIso) {
      const structuredQuery = {
        from: [{ collectionId: "reviews" }],
        orderBy: [
          { field: { fieldPath: "createdAt" }, direction: "ASCENDING" },
          { field: { fieldPath: "__name__" }, direction: "ASCENDING" },
        ],
        limit: REVIEW_PAGE_SIZE,
      };
      if (afterIso) {
        structuredQuery.where = {
          fieldFilter: { field: { fieldPath: "createdAt" }, op: "GREATER_THAN", value: { timestampValue: afterIso } },
        };
      }
      const parent = `${fsBase(cfg)}/${rootOf(cfg)}/${cfg.tenant}`;
      const res = await fetch(`${parent}:runQuery?key=${encodeURIComponent(cfg.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await cfgHeaders(cfg)) },
        body: JSON.stringify({ structuredQuery }),
      });
      if (!res.ok) throw new Error(`fsQueryReviews: HTTP ${res.status}`);
      const rows = await res.json();
      // The document's own createTime (not the round-tripped `createdAt`
      // field) is the cursor value — it's metadata Firestore always sets
      // correctly, rather than trusting a field the client also wrote.
      return rows.filter(r => r.document)
        .map(r => ({ ...fsDecodeFields(r.document.fields || {}), createdAt: r.document.createTime, __id: r.document.name.split("/").pop() }));
    }

    // Every review for one card, unordered (see pullReviews() for why this
    // is needed). Filtered by equality only, deliberately — an equality
    // filter needs no composite index in Firestore, an orderBy on a
    // different field would, and that's a Firebase-console step this app
    // has no business requiring for a path that's rare by design.
    async function fsQueryReviewsForCard(cfg, cardId) {
      const structuredQuery = {
        from: [{ collectionId: "reviews" }],
        where: { fieldFilter: { field: { fieldPath: "cardId" }, op: "EQUAL", value: { stringValue: cardId } } },
      };
      const parent = `${fsBase(cfg)}/${rootOf(cfg)}/${cfg.tenant}`;
      const res = await fetch(`${parent}:runQuery?key=${encodeURIComponent(cfg.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await cfgHeaders(cfg)) },
        body: JSON.stringify({ structuredQuery }),
      });
      if (!res.ok) throw new Error(`fsQueryReviewsForCard: HTTP ${res.status}`);
      const rows = await res.json();
      // __id feeds replayCard's tiebreak below — two rows can share a
      // reviewedAt millisecond, and without a stable secondary sort the
      // replay order (and therefore the resulting state) could differ
      // between devices computing the "same" replay independently.
      return rows.filter(r => r.document)
        .map(r => ({ ...fsDecodeFields(r.document.fields || {}), __id: r.document.name.split("/").pop() }));
    }

    // Every document in one collection, unfiltered — used by reconcile() to
    // discover every meta/baseline* doc without knowing their ids up front.
    async function fsListCollection(cfg, collectionId) {
      const structuredQuery = { from: [{ collectionId }] };
      const parent = `${fsBase(cfg)}/${rootOf(cfg)}/${cfg.tenant}`;
      const res = await fetch(`${parent}:runQuery?key=${encodeURIComponent(cfg.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await cfgHeaders(cfg)) },
        body: JSON.stringify({ structuredQuery }),
      });
      if (!res.ok) throw new Error(`fsListCollection ${collectionId}: HTTP ${res.status}`);
      const rows = await res.json();
      return rows.filter(r => r.document)
        .map(r => ({ ...fsDecodeFields(r.document.fields || {}), __id: r.document.name.split("/").pop() }));
    }

    // ---- Outbox: grades queue here first, sync is never on the critical
    // path of answering a card, online or off ----
    function loadOutbox() { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY)) || []; } catch { return []; } }
    function saveOutbox(rows) { localStorage.setItem(OUTBOX_KEY, JSON.stringify(rows)); }

    function enqueueReview(cardId, grade, atMs) {
      const rows = loadOutbox();   // always queue — flushes once signed in
      rows.push({ id: crypto.randomUUID(), cardId, grade, reviewedAt: new Date(atMs).toISOString() });
      saveOutbox(rows);
      flushOutbox();   // fire-and-forget
    }

    // The old Brain Gym build may still be installed as a home-screen icon,
    // and a home-screen icon opened offline runs entirely from its cache — it
    // can take grades that queue under the old outbox key and never reach the
    // server. Those grades are real reviews, so every open moves whatever is
    // sitting there into this build's outbox (deduped by the row's own uuid,
    // which both builds generate) and folds it into local state.
    //
    // This is the one old key this build writes to: it is emptied after the
    // move so the same rows can't be picked up twice.
    function scavengeLegacyOutbox() {
      let legacy;
      try { legacy = JSON.parse(localStorage.getItem(LEGACY_OUTBOX_KEY)) || []; } catch { legacy = []; }
      if (!legacy.length) return;
      const rows = loadOutbox();
      const known = new Set(rows.map(r => r.id));
      let folded = false, outOfOrder = false;
      // Oldest first, the same order replayCard uses — folding a later grade
      // before an earlier one would apply them backwards.
      for (const row of legacy.slice().sort((a, b) => new Date(a.reviewedAt) - new Date(b.reviewedAt))) {
        if (!known.has(row.id)) { rows.push(row); known.add(row.id); }
        const ts = new Date(row.reviewedAt).getTime();
        const lastApplied = srs[row.cardId]?.__lastReviewAt ?? -Infinity;
        if (ts > lastApplied) {
          srs[row.cardId] = schedule(srs[row.cardId], row.grade, ts, hash(row.cardId));
          srs[row.cardId].__lastReviewAt = ts;
          folded = true;
        } else if (ts < lastApplied) {
          // A grade older than something already applied to this card: an
          // incremental fold would apply them out of order, so hand it to a
          // full baseline-seeded replay instead once the log is complete.
          outOfOrder = true;
        }
        // ts === lastApplied: this exact grade is already reflected locally
        // (the key copy happened after the old app applied it). Nothing to do
        // beyond making sure it reaches the log, which the queue above does.
      }
      saveOutbox(rows);
      localStorage.setItem(LEGACY_OUTBOX_KEY, "[]");
      if (folded) saveSrs(srs);
      if (outOfOrder) localStorage.setItem(PENDING_REBUILD_KEY, "1");
    }

    // Resolves whatever the scavenger could not fold in order. Waits for the
    // outbox to drain first: replaying against a log that is still missing
    // this device's own pending rows would just rebuild the same gap.
    async function drainPendingRebuild() {
      if (!localStorage.getItem(PENDING_REBUILD_KEY)) return;
      if (!isSyncEnabled() || loadOutbox().length) return;
      await rebuildFromLog();
      localStorage.removeItem(PENDING_REBUILD_KEY);
    }

    let flushing = false;
    async function flushOutbox() {
      if (!isSyncEnabled() || flushing) return;
      flushing = true;
      let ok = true;
      setSyncStatus("syncing");
      try {
        // The queue is re-read on every pass and the sent row is removed by
        // id, never by position against a snapshot taken before the write.
        // Answering a card is deliberately not blocked on the network, so a
        // grade made while a write is in flight appends to the stored queue
        // mid-flush; writing back a pre-await copy of the array would erase
        // it. It would still be in local state, so nothing looks wrong on
        // this device — it would just never reach the log or the other one.
        for (;;) {
          const rows = loadOutbox();
          if (!rows.length) break;
          const row = rows[0];
          try {
            await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/reviews/${row.id}`, {
              cardId: row.cardId, grade: row.grade,
              reviewedAt: new Date(row.reviewedAt), clientId: getClientId(),
            });
          } catch (e) {
            console.warn("My Anki sync: flush paused, will retry", e);
            ok = false;
            break;   // leave the rest queued; next trigger (open/online/grade) retries
          }
          saveOutbox(loadOutbox().filter((r) => r.id !== row.id));
        }
      } finally {
        flushing = false;
        settleSyncStatus(ok);
      }
    }

    function loadCursor() { return localStorage.getItem(CURSOR_KEY) || null; }
    function saveCursor(iso) { localStorage.setItem(CURSOR_KEY, iso); }

    // Pulls everything since the last cursor and folds it into `srs` — rows
    // this device itself wrote are skipped for folding (already applied
    // locally the instant they were graded), so this normally only has work
    // to do after a review made on ANOTHER device.
    //
    // One thing has to be handled carefully: this device's own grade is
    // applied to `srs` the instant it happens, for a responsive UI — it
    // can't wait for a round trip. That's fine as long as every foreign
    // review folded in afterwards is chronologically LATER than whatever
    // this device already applied to that card. It usually is. The one case
    // it isn't: the same card graded on two devices before either had
    // synced. Folding the earlier-but-late-arriving review on top of the
    // already-applied later one would apply both in the wrong order —
    // `__lastReviewAt` (set in applyGrade and below, every time a review is
    // folded) is how that's detected, per card, and `needsRebuild` collects
    // the few cards where it's needed for a proper replay from full history
    // instead of a wrong incremental patch.
    async function pullReviews(cfgOverride = null) {
      if (!isSyncEnabled()) return;
      setSyncStatus("syncing");
      try {
        await pullReviewsInner(cfgOverride);
      } catch (e) {
        settleSyncStatus(false);
        throw e;        // callers still decide what a failed pull means
      }
      settleSyncStatus(true);
    }
    // Pure: replays `rows` (any order) on top of `seed` (a card's state as of
    // some earlier point, or undefined for "no history yet"), skipping any
    // row already reflected in `seed.__lastReviewAt`. The sort's secondary
    // key (`__id`) only matters for two rows sharing a reviewedAt millisecond
    // — rare, but without it two devices replaying "the same" rows could
    // apply them in different orders and land on different states.
    function replayCard(seed, rows) {
      const sorted = rows.slice().sort((a, b) => {
        const d = new Date(a.reviewedAt).getTime() - new Date(b.reviewedAt).getTime();
        if (d !== 0) return d;
        return a.__id < b.__id ? -1 : a.__id > b.__id ? 1 : 0;
      });
      let state = seed ? { ...seed } : undefined;
      for (const row of sorted) {
        const ts = new Date(row.reviewedAt).getTime();
        if (ts <= (state?.__lastReviewAt ?? -Infinity)) continue;
        state = schedule(state, row.grade, ts, hash(row.cardId));
        state.__lastReviewAt = ts;
      }
      return state;
    }

    async function pullReviewsInner(cfgOverride) {
      const cfg = cfgOverride || liveCfg();
      const myClientId = getClientId();
      const startedFromScratch = !loadCursor();
      let cursor = loadCursor();
      let appliedAny = false;
      const needsRebuild = new Set();
      // Only populated on a full rebuild (null starting cursor): every row
      // fetched below is already in hand, so a flagged card can replay from
      // this instead of paying for a second per-card round trip — see the
      // needsRebuild loop below.
      const fullLogByCard = startedFromScratch ? new Map() : null;
      for (;;) {
        const page = await fsQueryReviews(cfg, cursor);
        if (!page.length) break;
        for (const row of page) {
          const ts = new Date(row.reviewedAt).getTime();
          const lastApplied = srs[row.cardId]?.__lastReviewAt ?? -Infinity;
          if (fullLogByCard) {
            if (!fullLogByCard.has(row.cardId)) fullLogByCard.set(row.cardId, []);
            fullLogByCard.get(row.cardId).push(row);
          }
          if (row.clientId === myClientId && !startedFromScratch) {
            // Normally a no-op: this device's own applyGrade() already wrote
            // srs[cardId] before this row was ever enqueued, so there's
            // nothing to apply — just keep __lastReviewAt current. But if
            // the card is missing locally (a wiped/restored device, or a
            // reused client id), the assumption "my own row is already
            // reflected locally" is false, and silently doing nothing here
            // would drop that review forever — the cursor still advances
            // past it below. Route it through the same full replay the
            // out-of-order branch uses instead of trusting a shortcut that
            // no longer holds.
            //
            // The shortcut is also skipped entirely on a from-scratch pull
            // (no cursor). There, `srs` is a seed — the baseline, or state
            // inherited from an earlier build — not a record of what this
            // device has applied, so "my own row is already in it" isn't
            // something the cursor can vouch for. It specifically isn't true
            // across the Brain Gym import: those rows keep the clientId they
            // were written with, and this device carried that same client id
            // over with the rest of its keys, so every imported row looks
            // "own". Falling through to the two branches below reaches the
            // right answer either way — already-reflected rows land on the
            // tie and replay from the baseline, which is idempotent.
            if (srs[row.cardId]) srs[row.cardId].__lastReviewAt = Math.max(lastApplied, ts);
            else needsRebuild.add(row.cardId);
          } else if (ts > lastApplied) {
            // Strictly greater, not >=: on a full rebuild, `srs` starts out
            // seeded from the baseline, and a card's baseline
            // __lastReviewAt is exactly the ts of the last row already
            // folded into it (flushOutbox runs before migrateOrRebuild, so
            // every pre-sync grade is both a log row and baked into the
            // baseline). A >= here would let that exact row re-apply via
            // schedule() a second time — same grade, same timestamp, wrong
            // extra rep. Falling to needsRebuild instead triggers a full,
            // baseline-seeded replay, which is idempotent.
            srs[row.cardId] = schedule(srs[row.cardId], row.grade, ts, hash(row.cardId));
            srs[row.cardId].__lastReviewAt = ts;
            appliedAny = true;
          } else {
            needsRebuild.add(row.cardId);
          }
          cursor = row.createdAt;
        }
        if (page.length < REVIEW_PAGE_SIZE) break;
      }
      // Rare path: a full, correctly-ordered replay for just the cards where
      // an out-of-order arrival (or the tie above) was detected, using every
      // review for that card — own and foreign alike — seeded from the
      // baseline rather than from whatever happened to already be sitting in
      // `srs`, so a card whose earliest history lives only in the baseline
      // (never individually logged) doesn't lose that history on replay.
      if (needsRebuild.size) {
        let baselineState;   // fetched at most once, lazily, only if needed
        for (const cardId of needsRebuild) {
          const rows = fullLogByCard?.get(cardId) ?? await fsQueryReviewsForCard(cfg, cardId);
          if (baselineState === undefined) {
            const baseline = await fsGetDoc(cfg, `${rootOf(cfg)}/${cfg.tenant}/meta/baseline`);
            baselineState = baseline?.state || {};
          }
          srs[cardId] = replayCard(baselineState[cardId], rows);
          appliedAny = true;
        }
      }
      // Cursor is only persisted once every row on the way to it has been
      // fully resolved (folded or queued into needsRebuild AND replayed) —
      // if a fetch above throws, nothing here runs and the next attempt
      // simply redoes the same pull from the old cursor, rather than risking
      // a cursor that's already past rows whose replay never completed.
      if (cursor) saveCursor(cursor);
      if (appliedAny) {
        saveSrs(srs);
        session = newSession(activeTheme, session.queue[0]?.id);
        render();
      }
    }

    // New device, or localStorage wiped: start from the shared baseline (or
    // nothing, if sync was never turned on anywhere yet) and replay the whole
    // log on top of it.
    async function rebuildFromLog() {
      const baseline = await fsGetDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/meta/baseline`);
      srs = baseline ? { ...baseline.state } : {};
      localStorage.removeItem(CURSOR_KEY);
      await pullReviews();
    }

    // Runs once, the first time sync is enabled on this device. A device that
    // already has local review history becomes the baseline everyone else
    // replays from; a brand-new device just rebuilds from whatever's already
    // there. Note: if two devices both have independent pre-sync history and
    // enable sync at the same cold moment, only the first to reach the server
    // becomes the baseline — the loser's un-synced history stays local-only.
    // In practice this doesn't come up: turn sync on for one device, use it
    // a little, then open the setup link on the next one.
    async function migrateOrRebuild() {
      if (localStorage.getItem(MIGRATED_KEY)) { await pullReviews(); return; }
      if (Object.keys(srs).length === 0) {
        await rebuildFromLog();
      } else {
        let created;
        try {
          created = await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/meta/baseline`,
            { state: srs, takenAt: new Date() });
        } catch (e) {
          console.warn("My Anki sync: baseline write failed, will retry next launch", e);
          return;   // don't mark migrated — try again on next open
        }
        // Lost the race: another device already authored the baseline
        // (fsCreateDoc's 409 → { created: false }, not an exception — this
        // used to be silently treated as success). That baseline can hold
        // pre-sync history that exists nowhere else — no individual review
        // rows, just the snapshot — so it has to be fetched and folded in,
        // not skipped. Union by card, keeping whichever side reviewed it
        // more recently; either side's card wins outright if the other
        // doesn't have it at all.
        if (!created.created) {
          const baseline = await fsGetDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/meta/baseline`);
          if (baseline && baseline.state) {
            for (const [cardId, remote] of Object.entries(baseline.state)) {
              const local = srs[cardId];
              if (!local || (remote.__lastReviewAt ?? -Infinity) > (local.__lastReviewAt ?? -Infinity)) {
                srs[cardId] = remote;
              }
            }
            saveSrs(srs);
          }
        }
        await pullReviews();
      }
      localStorage.setItem(MIGRATED_KEY, "1");
    }

    // One-shot, per device: the two devices that had already diverged before
    // the pullReviewsInner/migrateOrRebuild fixes above shipped won't self-
    // heal just from those fixes — both are past the code paths that would
    // apply them (already migrated, cursor already at the tip). This runs
    // once more, computing the true canonical state straight from the
    // server (baseline + the full log, via replayCard) and reconciling
    // local `srs` against it, so the fix reaches devices that already have
    // stale local state, not just devices syncing for the first time from
    // here on.
    async function reconcile() {
      if (localStorage.getItem(RECONCILE_KEY)) return;
      // A local grade not yet on the server would look, incorrectly, like
      // local-only history worth preserving as residue (see below) — retry
      // once the outbox drains instead.
      if (loadOutbox().length) return;
      const cfg = liveCfg();
      const baseline = await fsGetDoc(cfg, `${COLLECTION}/${authUser.uid}/meta/baseline`);
      const baseState = baseline?.state || {};
      const rowsByCard = new Map();
      let cursor = null, lastCreatedAt = null;
      for (;;) {
        const page = await fsQueryReviews(cfg, cursor);
        if (!page.length) break;
        for (const row of page) {
          if (!rowsByCard.has(row.cardId)) rowsByCard.set(row.cardId, []);
          rowsByCard.get(row.cardId).push(row);
          cursor = row.createdAt;
        }
        lastCreatedAt = cursor;
        if (page.length < REVIEW_PAGE_SIZE) break;
      }
      const canon = {};
      const cardIds = new Set([...Object.keys(baseState), ...rowsByCard.keys(), ...Object.keys(srs)]);
      for (const cardId of cardIds) canon[cardId] = replayCard(baseState[cardId], rowsByCard.get(cardId) || []);

      // Fold local `srs` against the canonical truth: local wins only where
      // it's strictly newer than anything derivable from the server (the
      // pre-sync history of a device that lost a baseline race before the
      // migrateOrRebuild fix existed to merge it in) — a tie goes to the
      // canonical value so every device that reconciles lands on the exact
      // same state, not just an equivalent one.
      const residue = {};
      for (const [cardId, local] of Object.entries(srs)) {
        const localTs = local?.__lastReviewAt ?? -Infinity;
        const canonTs = canon[cardId]?.__lastReviewAt ?? -Infinity;
        if (localTs > canonTs) residue[cardId] = local;
        else srs[cardId] = canon[cardId];
      }
      for (const [cardId, state] of Object.entries(canon)) if (!(cardId in srs)) srs[cardId] = state;
      Object.assign(srs, residue);

      if (Object.keys(residue).length) {
        // This is expected to be empty in practice — the constant ~3-card
        // gap Hector saw is fully explained by the double-apply bug above,
        // not by lost pre-sync history. If it ever isn't empty, that's
        // surprising enough to want a loud signal rather than a silent
        // publish-and-move-on.
        console.warn("My Anki sync: reconcile found local-only history with no server counterpart, publishing", Object.keys(residue));
        try {
          await fsCreateDoc(cfg, `${COLLECTION}/${authUser.uid}/meta/baseline_${getClientId()}`,
            { state: residue, takenAt: new Date() });
        } catch (e) {
          console.warn("My Anki sync: residue publish failed, will retry next launch", e);
          return;   // don't mark reconciled — try again next open
        }
      }
      // Other devices may have published their own residue before this one
      // ran reconcile — fold those in too, so convergence doesn't depend on
      // reconcile order across devices.
      const metaDocs = await fsListCollection(cfg, "meta");
      const myResidueId = `baseline_${getClientId()}`;
      for (const doc of metaDocs) {
        if (!doc.__id.startsWith("baseline_") || doc.__id === myResidueId) continue;
        for (const [cardId, remote] of Object.entries(doc.state || {})) {
          const localTs = srs[cardId]?.__lastReviewAt ?? -Infinity;
          const remoteTs = remote?.__lastReviewAt ?? -Infinity;
          if (remoteTs > localTs) srs[cardId] = remote;
        }
      }

      saveSrs(srs);
      if (lastCreatedAt) saveCursor(lastCreatedAt);
      localStorage.setItem(RECONCILE_KEY, "1");
    }

    let authUser = null;        // { uid, email, getToken() } once signed in
    let authApi = null;         // { signIn, signOutUser } from the module script
    let authState = "loading";  // loading | out | in | unavailable

    // Advance the pull cursor past everything currently in the account's log
    // WITHOUT folding it — used right after the legacy import on a device
    // whose local `srs` is already the fold of everything it just copied.
    async function advanceCursorToTip() {
      let cursor = loadCursor();
      for (;;) {
        const page = await fsQueryReviews(liveCfg(), cursor);
        if (!page.length) break;
        cursor = page[page.length - 1].createdAt;
        saveCursor(cursor);
        if (page.length < REVIEW_PAGE_SIZE) break;
      }
    }

    // One-time, per device: copy the bookmark-era tenant (keyed by the old
    // sync-key hash, possibly in a different Firebase project) into the
    // signed-in account. Create-only writes with preserved review ids make
    // the copy idempotent even if two devices race to do it.
    async function importLegacyTenant() {
      if (localStorage.getItem(AUTH_MIGRATED_KEY)) return;
      const old = loadLegacyConfig();
      if (old && old.apiKey && old.projectId && old.syncKeyHash) {
        const src = legacyCfg(old);
        try { await pullReviews(src); } catch (e) { console.warn("My Anki sync: legacy pull failed", e); }
        const baseline = await fsGetDoc(src, `${rootOf(src)}/${src.tenant}/meta/baseline`);
        if (baseline) {
          await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/meta/baseline`,
            { state: baseline.state, takenAt: new Date(baseline.takenAt) });
        }
        let cursor = null;
        for (;;) {
          const page = await fsQueryReviews(src, cursor);
          for (const row of page) {
            await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/reviews/${row.__id}`, {
              cardId: row.cardId, grade: row.grade,
              reviewedAt: new Date(row.reviewedAt), clientId: row.clientId,
            });
            cursor = row.createdAt;
          }
          if (page.length < REVIEW_PAGE_SIZE) break;
        }
        if (Object.keys(srs).length > 0) {
          // Local state is already the fold of everything copied above.
          localStorage.setItem(MIGRATED_KEY, "1");
          await advanceCursorToTip();
        } else {
          localStorage.removeItem(MIGRATED_KEY);
          localStorage.removeItem(CURSOR_KEY);
        }
      }
      localStorage.setItem(AUTH_MIGRATED_KEY, "1");
    }

    // One-time, per device: copy this same account's Brain Gym era —
    // `brain_gym/{uid}`, written by every build before the 2026-08 rename —
    // into the collection this build reads and writes. Same shape as
    // importLegacyTenant above, and idempotent for the same reason: create-only
    // writes with preserved document ids mean two devices racing to migrate
    // produce one copy, not two, and a re-run after a failed attempt is a
    // sequence of no-ops.
    async function importBrainGymCollection() {
      if (localStorage.getItem(FS_IMPORT_KEY)) return;
      const src = brainGymCfg();
      // Fold anything on the old side this device hasn't applied yet. The
      // cursor carried over from the old app is an old-collection watermark,
      // which is exactly what this one pull wants; it's cleared below.
      try { await pullReviews(src); } catch (e) { console.warn("My Anki sync: Brain Gym pull failed", e); }

      // Meta first, so the review copy below can't trigger a replay that
      // reads a baseline which hasn't arrived yet. Enumerated rather than
      // assumed: the canonical `baseline` plus any `baseline_<clientId>`
      // residue docs a past reconcile published.
      for (const doc of await fsListCollection(src, "meta")) {
        await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/meta/${doc.__id}`,
          { state: doc.state, takenAt: new Date(doc.takenAt) });
      }

      // The log, oldest first. Preserving the document id is what makes the
      // copy idempotent; preserving clientId keeps every row attributable to
      // the device that actually made it, which is what lets the pull below
      // recognise this device's own history instead of re-folding it.
      // `createdAt` is deliberately NOT preserved — it is re-stamped server-
      // side on arrival, and ascending copy order keeps the relative sequence
      // intact. Replay correctness keys off `reviewedAt`, which is copied
      // verbatim.
      let cursor = null, tip = null;
      for (;;) {
        const page = await fsQueryReviews(src, cursor);
        for (const row of page) {
          await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/reviews/${row.__id}`, {
            cardId: row.cardId, grade: row.grade,
            reviewedAt: new Date(row.reviewedAt), clientId: row.clientId,
          });
          cursor = row.createdAt;
          tip = row.createdAt;
        }
        if (page.length < REVIEW_PAGE_SIZE) break;
      }

      // A full pull of the new collection from a cleared cursor — NOT
      // advanceCursorToTip, which importLegacyTenant can get away with only
      // because nothing else writes to its destination. Here the other device
      // may have migrated first and already be writing reviews to the new
      // collection that this one has never seen; skipping the fold would drop
      // them silently. The full pull is safe to repeat: this device's own rows
      // only bump __lastReviewAt, and anything out of order falls through to a
      // baseline-seeded replay.
      localStorage.removeItem(CURSOR_KEY);
      if (Object.keys(srs).length > 0) localStorage.setItem(MIGRATED_KEY, "1");
      await pullReviews();
      // Last, so a failure anywhere above simply re-runs the whole import on
      // the next open rather than marking it done.
      localStorage.setItem(FS_IMPORT_KEY, tip || new Date(0).toISOString());
    }

    // The old app can outlive the import: a home-screen icon whose service
    // worker hasn't picked up the forwarder yet still writes to the old
    // collection, and after the one-time copy above nothing would ever read
    // those rows again. One bounded query per open closes that window. It
    // stops finding anything once every device is on this build, and can be
    // deleted along with the import.
    async function probeBrainGymStrays() {
      const tip = localStorage.getItem(FS_IMPORT_KEY);
      if (!tip) return;   // import hasn't run yet — it will copy everything anyway
      const src = brainGymCfg();
      let cursor = tip, found = 0;
      for (;;) {
        const page = await fsQueryReviews(src, cursor);
        for (const row of page) {
          // Deliberately NOT copied under the original clientId, unlike the
          // import above. A stray was written by the old app, whose state
          // this build did not inherit — the row is not reflected in local
          // `srs`, so letting the pull treat it as "my own, already applied"
          // would drop the grade for good. Marking it foreign routes it
          // through the normal fold (or a replay, if it lands out of order),
          // which is correct on this device and on every other one.
          const res = await fsCreateDoc(liveCfg(), `${COLLECTION}/${authUser.uid}/reviews/${row.__id}`, {
            cardId: row.cardId, grade: row.grade,
            reviewedAt: new Date(row.reviewedAt), clientId: `${row.clientId}|brain-gym`,
          });
          if (res.created) found += 1;
          cursor = row.createdAt;
        }
        if (page.length < REVIEW_PAGE_SIZE) break;
      }
      localStorage.setItem(FS_IMPORT_KEY, cursor);
      if (found) {
        console.warn(`My Anki sync: recovered ${found} review(s) the old Brain Gym app wrote after this device migrated`);
        await pullReviews();
      }
    }

    // ---- App state: the review IS the app ----
    let activeTheme = "all";
    let session = newSession("all");

    // Moves any pending card whose `due` has actually arrived into the
    // visible queue. Called at the top of every render and after grading, so
    // a card promised "back in 6m" can never reappear before that time
    // really passes — the bug the positional splice() used to have.
    function promotePending(s) {
      const now = Date.now();
      const ready = [];
      s.pending = s.pending.filter(c => {
        if (srs[c.id] && srs[c.id].due <= now) { ready.push(c); return false; }
        return true;
      });
      s.queue.push(...ready);
    }

    // Live countdown while waiting on a step delay: mm:ss under an hour
    // (the only case that occurs — learning/relearn steps top out at 10m),
    // hours:minutes beyond that as a defensive fallback.
    function fmtCountdown(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return `${m}:${String(r).padStart(2, "0")}`;
      const h = Math.floor(m / 60);
      return `${h}h ${m % 60}m`;
    }

    // Armed only while the "waiting" screen (queue empty, pending non-empty)
    // is on screen, so the countdown ticks and the app transitions to the
    // next card the moment it's actually due — cleared everywhere else so
    // an idle open never runs a timer for nothing.
    let waitTimer = null;
    function clearWaitTimer() {
      if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
    }

    // `keepCardId`, when given, pulls that card back to the front of the
    // fresh queue if it's still there — so a sync pull landing mid-answer
    // (the other device just graded something) doesn't yank the question out
    // from under you. Only used when rebuilding an in-progress session, never
    // on an intentional theme switch.
    function newSession(theme, keepCardId) {
      const queue = dueCards(theme);
      if (keepCardId) {
        const idx = queue.findIndex(c => c.id === keepCardId);
        if (idx > 0) queue.unshift(queue.splice(idx, 1)[0]);
      }
      // `pending` holds cards graded this session that didn't graduate (still
      // "lrn"/"rel"). They wait here — not in `queue` — until their own
      // `srs[id].due` timestamp actually arrives; see promotePending().
      // No `done`/`total` here on purpose — see progress().
      return { queue, pending: [], revealed: false };
    }
    function setTheme(theme) {
      activeTheme = theme;
      session = newSession(theme);
      render();
    }

    // ---- Deck freshness ----
    // data.js is generated by a nightly job, not by this app, and this app
    // can be sitting open on a device when a new deck lands. Without this,
    // that device shows a frozen catalog — a different book/card count than
    // any other device — until someone thinks to force-quit and reopen it,
    // and a plain reload isn't reliable either: the service worker's own
    // network-first fetch can still hand back the copy that was current when
    // the tab was opened. So the app re-fetches data.js itself and swaps it
    // in live when the content actually changed.
    let lastDeckCheckAt = 0;
    const DECK_CHECK_MIN_INTERVAL_MS = 60e3;

    // ---- Applying an update safely ----
    // Two different things can land while this tab is open — a new deck, or
    // a new build of the app itself (via a service-worker update) — and both
    // share the same one rule: never yank the question out from under a
    // reviewer mid-answer. `pendingApply` holds at most one of them; a
    // reload always wins over a deck swap, since a reload picks up whatever
    // deck is current anyway.
    let pendingApply = null;   // null | "reload" | { deck: <object> }
    function whenSafe(action) {
      if (session.revealed) {
        if (action === "reload" || pendingApply !== "reload") pendingApply = action;
        return;
      }
      applyPending(action);
    }
    function applyPending(action) {
      if (action === "reload") { location.reload(); return; }
      if (action && action.deck) swapDeck(action.deck);
    }
    // Called right after a grade is applied and the card is no longer on
    // screen mid-answer — the one moment it's always safe to apply anything
    // that was waiting.
    function applyDeferred() {
      if (!pendingApply) return false;
      const action = pendingApply;
      pendingApply = null;
      applyPending(action);
      return true;
    }

    function swapDeck(data) {
      const keepCardId = session.queue[0]?.id;
      applyDeck(data);
      // `newOrder` is left alone on purpose, same as every other session
      // rebuild (sync pull, auth change): it's keyed by card id, so ids that
      // still exist keep their shuffled rank and keepCardId can actually find
      // the card the reviewer was just looking at. Wiping it here would make
      // that lookup fail — a real deck refresh doesn't need a new shuffle,
      // just the new content.
      session = newSession(activeTheme, keepCardId);
      render();
    }

    // data.js is `window.ANKI = {...};` — a JS statement, not JSON on its
    // own. The object literal itself is always JSON-valid (build_deck.py
    // writes it that way); only the assignment wrapper isn't, so strip that.
    function parseDeckText(text) {
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");
      if (start === -1 || end === -1) throw new Error("no object literal found");
      return JSON.parse(text.slice(start, end + 1));
    }

    async function checkDeck() {
      const now = Date.now();
      if (now - lastDeckCheckAt < DECK_CHECK_MIN_INTERVAL_MS) return;
      lastDeckCheckAt = now;
      let text;
      try {
        // The service worker already fetches same-origin GETs network-first
        // with the HTTP cache bypassed and refreshes its own cache as a side
        // effect — `no-store` here just covers the case it isn't installed
        // or active yet (very first load, or a browser that dropped it).
        const res = await fetch("./data.js", { cache: "no-store" });
        if (!res.ok) return;
        text = await res.text();
      } catch { return; }   // offline, or blocked — the loaded deck stays authoritative
      let data;
      try { data = parseDeckText(text); } catch (e) { console.warn("My Anki: bad data.js, ignoring", e); return; }
      if (!data || !Array.isArray(data.themes) || !Array.isArray(data.books)) return;
      if (JSON.stringify(data) === deckSnapshot) return;   // already current
      whenSafe({ deck: data });
    }

    // Leeches disappear from the queue silently by design, but not from the
    // record: the footer owns up to how many are parked.
    function footSuspended() {
