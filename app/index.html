      const n = cards.filter(c => srs[c.id] && srs[c.id].leech).length;
      return n ? ` · ${n} suspended as leech${n === 1 ? "" : "es"}` : "";
    }

    function pillsHtml() {
      const decks = [{ id: "all", label: "All" }, ...themes];
      const pills = decks.map(d =>
        `<button class="pill" aria-pressed="${activeTheme === d.id}" data-theme="${d.id}" title="${esc(d.label)}">` +
        `<span class="t">${esc(d.label)}</span>` +
        `<span class="n">${dueCards(d.id).length}</span></button>`).join("");
      return `<div class="pills" role="group" aria-label="Deck" style="--n:${decks.length}">${pills}</div>`;
    }

    // ---- The two shared controls ----
    // Identity and sync health are separate on purpose: "Sign in" answers who
    // you are, the status pill answers whether today's grades actually left
    // this device. The old single green dot conflated them, which is exactly
    // what made a phone-vs-laptop mismatch impossible to diagnose.
    function accountHtml() {
      if (authState === "in") {
        const email = (authUser && authUser.email) || "Signed in";
        const name = email.split("@")[0];
        return `<button class="account" id="accountBtn" type="button" title="${esc(email)} — sign out">`
             + `<span class="av">${esc(name.slice(0, 1).toUpperCase())}</span><span class="nm">${esc(name)}</span></button>`;
      }
      if (authState === "unavailable") return `<span class="account off" title="Google sign-in unreachable — reviews stay on this device">offline</span>`;
      if (authState === "out") return `<button class="account out" id="accountBtn" type="button">Sign in</button>`;
      return "";
    }

    const LASTSYNC_KEY = "my-anki.lastsync.v1";
    let syncState = "local";   // local | syncing | synced | pending | offline | issue
    let agoTimer = null;

    // "just now" under a minute, then 4m / 3h / 2d.
    function syncAgo(ts) {
      if (!ts) return "";
      const s = (Date.now() - ts) / 1000;
      if (s < 60) return "just now";
      const m = s / 60;
      if (m < 60) return Math.round(m) + "m";
      const h = m / 60;
      if (h < 24) return Math.round(h) + "h";
      return Math.round(h / 24) + "d";
    }
    const loadLastSync = () => Number(localStorage.getItem(LASTSYNC_KEY)) || 0;

    function syncLabel() {
      if (syncState === "syncing") return "Syncing";
      if (syncState === "pending") return loadOutbox().length + " pending";
      if (syncState === "offline") return "Offline";
      if (syncState === "issue") return "Sync issue";
      if (syncState === "synced") {
        const ago = syncAgo(loadLastSync());
        return ago ? `Synced · ${ago}` : "Synced";
      }
      return "Local only";
    }
    function syncStatusHtml() {
      return `<div class="sync-status" id="syncStatus" data-status="${syncState}" aria-live="polite">${syncLabel()}</div>`;
    }
    // Patches the pill in place rather than re-rendering the app: a status
    // change must never yank the card you're mid-answer out from under you.
    function setSyncStatus(state) {
      syncState = state;
      const el = document.getElementById("syncStatus");
      if (el) { el.dataset.status = state; el.textContent = syncLabel(); }
      if (agoTimer) { clearInterval(agoTimer); agoTimer = null; }
      // Keep the "· 2m" honest while the tab stays open, cheaply.
      if (state === "synced") agoTimer = setInterval(() => {
        const e = document.getElementById("syncStatus");
        if (e && syncState === "synced") e.textContent = syncLabel();
      }, 60e3);
    }
    // Called after any sync attempt settles: the outbox is the source of truth
    // for whether anything is still owed to the server.
    function settleSyncStatus(ok) {
      if (!isSyncEnabled()) return setSyncStatus("local");
      if (!navigator.onLine) return setSyncStatus("offline");
      if (!ok) return setSyncStatus("issue");
      if (loadOutbox().length) return setSyncStatus("pending");
      localStorage.setItem(LASTSYNC_KEY, String(Date.now()));
      setSyncStatus("synced");
    }

    function headerHtml(pos) {
      return `
        <div class="bar">
          <h1>My Anki</h1>
          <span class="account-bar">${syncStatusHtml()}${accountHtml()}<span class="pos">${pos}</span></span>
        </div>
        ${pillsHtml()}`;
    }

    function render() {
      const s = session;
      clearWaitTimer();
      promotePending(s);

      if (!s.queue.length && s.pending.length) {
        // Everything left this session is a card that was graded Again/Hard
        // and genuinely has to wait out its own step delay — not a fixed
        // number of other cards, its real `due` timestamp. Ticks itself so
        // the app moves on the moment that time arrives, with no polling
        // once you navigate away (setTheme() starts a fresh session, and
        // clearWaitTimer() above always tears this down first).
        const soonest = Math.min(...s.pending.map(c => srs[c.id].due));
        const { done: wDone, total: wTotal } = progress(s);
        app.innerHTML = `
          ${headerHtml(`${wDone} / ${wTotal} · waiting`)}
          <div class="progress"><div style="width:${Math.round(100 * wDone / wTotal)}%"></div></div>
          <div class="done">
            <div class="wait-time" id="waitTime">${fmtCountdown(soonest - Date.now())}</div>
            <p>${s.pending.length} card${s.pending.length === 1 ? "" : "s"} due back shortly —<br>this is the real wait, not a shortcut.</p>
          </div>
          <p class="foot-note">${books.length} books · ${cards.length} cards in the deck${footSuspended()}</p>`;
        bindPills();
        waitTimer = setInterval(() => render(), 1000);
        return;
      }

      if (!s.queue.length) {
        const doneToday = reviewedToday(activeTheme);
        app.innerHTML = `
          ${headerHtml("")}
          <div class="progress"><div style="width:100%"></div></div>
          <div class="done">
            <div class="big">✓</div>
            <h2>${doneToday ? "Deck clear" : "Nothing due"}</h2>
            <p>${doneToday
              ? `${doneToday} card${doneToday === 1 ? "" : "s"} reviewed today${activeTheme === "all" ? "" : " in " + esc(THEME[activeTheme])}.<br>The schedule takes it from here.`
              : `No ${activeTheme === "all" ? "" : esc(THEME[activeTheme]) + " "}cards due today.<br>Pick another theme or come back tomorrow.`}</p>
          </div>
          <p class="foot-note">${books.length} books · ${cards.length} cards in the deck${footSuspended()}</p>`;
        bindPills();
        return;
      }

      const c = s.queue[0];
      const st = srs[c.id];
      const isQ = !!c.q;
      const { done, total } = progress(s);
      const pct = Math.round(100 * done / total);

      const front = isQ
        ? `<span class="prompt-label">Recall · ${esc(shortTitle(c.book.title))}</span>
           <p class="question">${esc(c.q)}</p>`
        : `<span class="prompt-label">Which book is this from — and why did you save it?</span>
           <p class="quote">${esc(c.text)}</p>`;

      const back = !s.revealed ? "" : `
        <div class="answer">
          ${isQ ? `<p class="quote">${esc(c.text)}</p>` : ""}
          <p class="src-line"><span class="bt">${esc(shortTitle(c.book.title))}</span> — ${esc(c.book.author)} · loc. ${c.loc} · <span class="badge">${esc(THEME[c.theme])}</span></p>
          ${c.note ? `<p class="note-box">${esc(c.note)}</p>` : ""}
        </div>`;

      const grades = [["Again", 0], ["Hard", 1], ["Good", 2], ["Easy", 3]].map(([label, g]) =>
        `<button class="grade g${g}" data-g="${g}"><b>${label}</b><span>${delayLabel(st, g, c.id)}</span></button>`).join("");

      app.innerHTML = `
        ${headerHtml(`${done} / ${total}${st ? "" : " · new"}`)}
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="stage">${front}${back}</div>
        <div class="controls">
          ${s.revealed ? `<div class="grades">${grades}</div>`
                       : `<button class="btn" id="reveal">Show answer</button>`}
        </div>`;

      bindPills();
      const rv = document.getElementById("reveal");
      if (rv) rv.addEventListener("click", () => { s.revealed = true; render(); });
      document.querySelectorAll(".grade").forEach(b => b.addEventListener("click", () => {
        const next = applyGrade(c.id, Number(b.dataset.g));
        s.queue.shift();
        // Progress is derived from __lastReviewAt now (see progress()), so
        // grading this card already counted it — every grade, including a
        // Good on a new card that isn't done for today yet. A card that
        // graduated to review or just got suspended as a leech is finished;
        // one still in a learning step goes to `pending` and only comes back
        // once its own due timestamp really arrives — see promotePending().
        if (next.st !== "rev" && !next.leech) s.pending.push(c);
        s.revealed = false;
        // A fresher deck, or a whole new app build, may have arrived while
        // this card was up — apply it now that the card is answered.
        if (!applyDeferred()) render();
      }));
    }

    function bindPills() {
      document.querySelectorAll(".pill").forEach(p =>
        p.addEventListener("click", () => setTheme(p.dataset.theme)));
      const acct = document.getElementById("accountBtn");
      if (acct) acct.addEventListener("click", async () => {
        if (authState === "out") {
          try { await authApi.signIn(); } catch (e) { console.warn("My Anki sync: sign-in failed", e); }
        } else if (authState === "in" && confirm("Sign out of sync on this device?")) {
          authApi.signOutUser();
        }
      });
    }

    // Before the first paint: grades the old app queued but never sent belong
    // in local state whether or not this open ever reaches a signed-in sync.
    scavengeLegacyOutbox();

    render();
    checkDeck();   // this load may itself have come from a stale SW/CDN copy

    let swRegistration = null;
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => { swRegistration = reg; })
          .catch(() => {});
      });
      // A deploy replaces sw.js's bytes; the browser installs the new worker,
      // it skipWaiting()s and clients.claim()s (see sw.js), and the instant
      // it takes over, `controller` changes out from under this tab. None of
      // that touches the JS already running here, though — a page can never
      // replace its own executing code, only reload into fresh code. So this
      // is the one signal that a reload actually has something new to fetch,
      // and it's what makes every deploy AFTER this one self-apply on every
      // open device without anyone closing an app or reading instructions.
      // (This deploy itself is the exception: a tab already open before it
      // shipped has no way to hear about it until it navigates on its own —
      // that first pickup still needs one manual close-and-reopen.)
      navigator.serviceWorker.addEventListener("controllerchange", () => whenSafe("reload"));
    }

    // Sync starts after the first paint, deliberately: the app is fully
    // interactive offline before any of this runs, and stays fully usable
    // signed out — grades queue locally and follow the account once the
    // Sign in chip is used. The module script below builds the real
    // Firebase Auth services and calls start(); tests can pass fakes.
    window.MyAnkiSync = {
      firebaseConfig: FIREBASE,
      start(api) {
        authApi = api;
        api.onAuthChange(async (user) => {
          authUser = user;
          authState = user ? "in" : "out";
          if (!user) { setSyncStatus("local"); render(); return; }
          syncState = navigator.onLine ? "syncing" : "offline";
          render();
          try {
            scavengeLegacyOutbox();
            await importLegacyTenant();
            await importBrainGymCollection();
            await flushOutbox();
            await probeBrainGymStrays();
            await drainPendingRebuild();
            await migrateOrRebuild();
            await reconcile();
            session = newSession(activeTheme, session.queue[0]?.id);
            render();
            settleSyncStatus(true);
          } catch (e) {
            console.warn("My Anki sync: startup failed", e);
            settleSyncStatus(false);
          }
        });
      },
      unavailable(e) {
        console.warn("My Anki sync: auth unavailable", e);
        authState = "unavailable";
        setSyncStatus("offline");
        render();
      },
    };
    // Browsers only recheck a service worker's bytes on their own roughly
    // once a day; explicitly asking on every real signal that the app is
    // actually in use (foreground, reconnect, and the interval below as the
    // catch-all) is what makes controllerchange fire promptly instead of
    // eventually.
    function pokeForUpdates() {
      checkDeck();
      swRegistration?.update().catch(() => {});
    }
    addEventListener("online", () => { pokeForUpdates(); if (isSyncEnabled()) { flushOutbox(); pullReviews().catch(() => {}); } });
    addEventListener("offline", () => { if (isSyncEnabled()) setSyncStatus("offline"); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      pokeForUpdates();
      if (isSyncEnabled()) { flushOutbox(); pullReviews().catch(() => {}); }
    });
    // iOS Safari in particular doesn't reliably fire visibilitychange when a
    // home-screen PWA resumes from the app switcher, so a plain timer is the
    // one trigger that doesn't depend on the OS/browser cooperating. Both
    // calls inside are already self-throttled/cheap.
    setInterval(pokeForUpdates, 15 * 60e3);
  </script>
  <script type="module">
    (async () => {
      try {
        const [{ initializeApp }, auth] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
        ]);
        const app = initializeApp(window.MyAnkiSync.firebaseConfig);
        const instance = auth.getAuth(app);
        const provider = new auth.GoogleAuthProvider();
        auth.getRedirectResult(instance).catch((e) => console.warn(e));
        window.MyAnkiSync.start({
          onAuthChange(cb) {
            auth.onAuthStateChanged(instance, (u) => {
              cb(u ? { uid: u.uid, email: u.email, getToken: () => u.getIdToken() } : null);
            });
          },
          async signIn() {
            try {
              await auth.signInWithPopup(instance, provider);
            } catch (e) {
              const popupIssues = [
                "auth/popup-blocked",
                "auth/popup-closed-by-user",
                "auth/cancelled-popup-request",
                "auth/operation-not-supported-in-this-environment",
              ];
              if (popupIssues.includes(e.code)) await auth.signInWithRedirect(instance, provider);
              else throw e;
            }
          },
          signOutUser: () => auth.signOut(instance),
        });
      } catch (e) {
        window.MyAnkiSync.unavailable(e);
      }
    })();
  </script>
</body>
</html>
