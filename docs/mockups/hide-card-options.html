<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
#hide-options{font-family:Geist,Inter,system-ui,sans-serif}#hide-options *{box-sizing:border-box}#hide-options .demo{max-width:390px;margin:0 auto 32px}#hide-options h3{font-size:14px;font-weight:600;margin:0 0 10px}#hide-options .phone{background:#09090b;color:#fafafa;border:1px solid #27272a;border-radius:20px;padding:20px 16px 16px;position:relative}#hide-options .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}#hide-options .brand{font-size:18.4px;font-weight:700;letter-spacing:-.02em}#hide-options .sync{font-size:12px;color:#a1a1aa;border:1px solid #27272a;border-radius:999px;padding:4px 10px}#hide-options .sync:before{content:'';display:inline-block;width:6px;height:6px;background:#4ade80;border-radius:50%;margin-right:6px}#hide-options .stage{background:#101012;border:1px solid #27272a;border-radius:12px;padding:20px;min-height:210px;position:relative}#hide-options .source{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#a1a1aa}#hide-options .question{font-size:18.4px;line-height:1.45;font-weight:600;margin:16px 0;letter-spacing:-.01em}#hide-options .source-row{display:flex;align-items:center;justify-content:space-between;gap:8px}#hide-options button{font:inherit;cursor:pointer}#hide-options .quiet{border:0;background:transparent;color:#a1a1aa;min-height:44px;padding:8px 10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}#hide-options .quiet svg{width:16px;height:16px}#hide-options .icon{width:44px;flex-shrink:0}#hide-options .action{background:#fafafa;color:#18181b;border:0;border-radius:10px;height:48px;width:100%;font-size:15px;font-weight:600}#hide-options .controls{margin-top:24px}#hide-options .below{text-align:center;margin-top:4px}#hide-options .stage-footer{border-top:1px solid #27272a;margin-top:22px;padding-top:4px;display:flex;justify-content:flex-end}#hide-options .split{display:grid;grid-template-columns:1fr 100px;gap:8px}#hide-options .outline{border:1px solid #27272a;border-radius:10px;color:#a1a1aa;background:#09090b;font-size:13px}#hide-options .menu{position:absolute;top:62px;right:14px;background:#18181b;border:1px solid #27272a;border-radius:10px;padding:5px;z-index:2;box-shadow:0 8px 24px #0008}#hide-options .menu button{color:#fafafa}#hide-options .toast{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #27272a;border-radius:10px;background:#18181b;margin-top:14px;padding:4px 12px;font-size:13px}#hide-options .toast button{color:#fafafa;text-decoration:underline;text-underline-offset:3px}#hide-options .foot{font-size:11px;color:#a1a1aa;text-align:center;margin-top:14px}#hide-options .answer{font-size:14px;line-height:1.5;border-top:1px solid #27272a;padding-top:12px}#hide-options .ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#hide-options .grade{height:48px;border:1px solid #27272a;border-radius:10px;background:#09090b;font-size:13px;font-weight:600}#hide-options [hidden]{display:none!important}
</style>
<div id="hide-options">
<section class="demo" data-option="1" aria-label="Hide below the answer button"><h3>1 · Quiet action below the answer button</h3><div class="phone"></div></section>
<section class="demo" data-option="2" aria-label="Hide in the card footer"><h3>2 · In the card footer</h3><div class="phone"></div></section>
<section class="demo" data-option="3" aria-label="Hide icon beside the source"><h3>3 · Small icon beside the source</h3><div class="phone"></div></section>
<section class="demo" data-option="4" aria-label="Hide in a card menu"><h3>4 · Inside a card menu</h3><div class="phone"></div></section>
<section class="demo" data-option="5" aria-label="Hide beside show answer"><h3>5 · Beside Show answer</h3><div class="phone"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('hide-options');
const hideButton='<button type="button" class="quiet hide"><i data-lucide="eye-off" aria-hidden="true"></i>Hide card</button>';
root.querySelectorAll('.demo').forEach(demo=>{
const option=Number(demo.dataset.option),phone=demo.querySelector('.phone');let hidden=false,revealed=false,advanced=false;
function render(){
phone.innerHTML=`<div class="top"><span class="brand">My Anki</span><span class="sync">Synced</span></div><div class="stage"><div class="source-row"><span class="source">Recall · Your Money or Your Life</span>${option===3?'<button type="button" class="quiet icon hide" aria-label="Hide card" data-tooltip="Hide card"><i data-lucide="eye-off" aria-hidden="true"></i></button>':''}${option===4?'<button type="button" class="quiet icon more" aria-label="Card options" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button><div class="menu" hidden>'+hideButton+'</div>':''}</div><p class="question">${hidden||advanced?'What does financial independence give you?':'How do the authors redefine retirement?'}</p>${revealed?'<div class="answer">The freedom to choose how you spend your time.</div>':''}${option===2?'<div class="stage-footer">'+hideButton+'</div>':''}</div><div class="controls">${revealed?'<div class="ratings"></div>':option===5?'<div class="split"><button type="button" class="action reveal">Show answer</button><button type="button" class="outline hide">Hide card</button></div>':'<button type="button" class="action reveal">Show answer</button>'}${option===1?'<div class="below">'+hideButton+'</div>':''}</div>${hidden?'<div class="toast" role="status"><span>Card hidden</span><button type="button" class="quiet undo">Undo</button></div>':''}<div class="foot">deck 13 Sep · newest highlight 11 Sep</div>`;
phone.querySelectorAll('.hide').forEach(b=>b.onclick=()=>{hidden=true;revealed=false;render();});
const undo=phone.querySelector('.undo');if(undo)undo.onclick=()=>{hidden=false;advanced=false;revealed=false;render();};
const reveal=phone.querySelector('.reveal');if(reveal)reveal.onclick=()=>{revealed=true;render();};
const more=phone.querySelector('.more');if(more)more.onclick=()=>{const menu=phone.querySelector('.menu');menu.hidden=!menu.hidden;more.setAttribute('aria-expanded',String(!menu.hidden));};
const ratings=phone.querySelector('.ratings');if(ratings)['Again','Hard','Good','Easy'].forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='grade';b.textContent=label;b.style.color=['#f87171','#fbbf24','#4ade80','#60a5fa'][i];b.onclick=()=>{advanced=true;revealed=false;render();};ratings.append(b);});
if(globalThis.lucide)lucide.createIcons();
}
render();
const state={showAnswer:false};if(globalThis.Tweak){const t=new Tweak({container:demo,onChange:()=>{revealed=state.showAnswer;render();}});t.addToggle(state,'showAnswer',{label:'Answer visible'});}
});
})();
</script>
